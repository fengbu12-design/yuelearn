<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF7F1">
<meta name="description" content="個人粵語自學站：教材精讀、配套影片、粵拼注音、跟讀練習與筆記">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23A8442A'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23FAF7F1' font-family='serif'%3E粵%3C/text%3E%3C/svg%3E">
<title>粵語自習室 · 第 3 課 打電話</title>
<style>
:root{
  --paper:#FAF7F1; --card:#FFFFFF; --ink:#211E1A; --ink2:#6E6659; --ink3:#9B9285;
  --line:#E7E0D3; --line2:#D8CFBE;
  --accent:#A8442A; --accent-soft:#F6E7E1;
  --jade:#2E6B5E; --jade-soft:#E2EFEA;
  --gold:#B9862B;
  --serif:"Songti SC","STSong","Noto Serif TC","Source Han Serif TC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans TC",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
html[data-theme="dark"]{
  --paper:#151412; --card:#1E1C18; --ink:#EDE7DB; --ink2:#B6AC9B; --ink3:#8E8474;
  --line:#2E2B25; --line2:#3A362E;
  --accent:#D8704F; --accent-soft:#2A1D17;
  --jade:#6FB8A2; --jade-soft:#1B2A24;
  --gold:#C99A3E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
.app{display:grid;grid-template-columns:274px minmax(0,1fr);min-height:100vh}
main{min-width:0}

/* ---------- sidebar ---------- */
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);padding:26px 18px 30px;
  background:var(--paper);
}
.brand{padding:0 8px 20px;display:block;text-align:left;width:100%}
.brand b{display:block;font-family:var(--serif);font-size:21px;letter-spacing:.12em;font-weight:500}
.brand span{display:block;font-size:11px;color:var(--ink3);letter-spacing:.18em;margin-top:4px}
.brand:hover b{color:var(--accent)}
.vol{margin-top:18px}
.vol-h{display:flex;align-items:baseline;gap:8px;padding:0 8px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;white-space:nowrap}
.vol-h b{font-family:var(--serif);font-size:13px;letter-spacing:.14em;color:var(--ink2);font-weight:500;flex:none}
.vol-h i{font-style:normal;font-size:11px;color:var(--ink3);font-family:var(--mono);flex:none}
.vol-h em{font-style:normal;font-size:11px;color:var(--ink3);margin-left:auto;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:14px;line-height:1.4;
}
.nav-item .n{font-family:var(--mono);font-size:11px;color:var(--ink3);width:20px;flex:none}
.nav-item:hover{background:var(--accent-soft);color:var(--ink)}
.nav-item.on{background:var(--accent);color:#fff}
.nav-item.on .n{color:rgba(255,255,255,.65)}
.nav-item.lock{opacity:.42;cursor:not-allowed}
.nav-item.lock:hover{background:none;color:var(--ink2)}
.nav-item .dot{width:5px;height:5px;border-radius:50%;background:var(--jade);margin-left:auto;flex:none}
.side-foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:4px}
.side-foot button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink2)
}
.side-foot button:hover{background:var(--accent-soft);color:var(--ink)}
.side-foot b{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--jade)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topbar-in{max-width:920px;margin:0 auto;padding:12px 40px;display:flex;align-items:center;gap:12px}
.crumb{font-size:12.5px;color:var(--ink3);letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.chip-tools{display:flex;gap:6px;align-items:center;flex:none}
.tool{
  font-size:12px;padding:5px 10px;border:1px solid var(--line2);border-radius:999px;
  color:var(--ink2);background:var(--card);letter-spacing:.03em;white-space:nowrap
}
.tool:hover{border-color:var(--accent);color:var(--accent)}
.tool.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.progress-line{height:2px;background:var(--line)}
.progress-line i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.menu-btn{display:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);place-items:center;color:var(--ink2);flex:none}

/* ---------- content ---------- */
.wrap{max-width:920px;margin:0 auto;padding:0 40px 140px}
.hero{padding:40px 0 24px;border-bottom:1px solid var(--line)}
.hero-top{display:flex;gap:32px;align-items:flex-start}
.hero-main{flex:1;min-width:0}
.hero .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;color:var(--accent);text-transform:uppercase}
.hero h1{
  font-family:var(--serif);font-size:56px;line-height:1.25;font-weight:500;
  letter-spacing:.14em;margin:10px 0 6px;
}
.hero h1 ruby rt{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em;font-weight:400}
.hero .meta{font-size:12.5px;color:var(--ink3);display:flex;gap:16px;flex-wrap:wrap}
.hero .meta span::before{content:"·";margin-right:7px;opacity:.5}
.hero .meta span:first-child::before{content:none}
.hero-side{flex:none;width:186px;padding-top:6px}
.ringwrap{position:relative;width:76px;height:76px;margin-bottom:10px}
.ringwrap svg{display:block;width:76px;height:76px}
.ringwrap b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink)
}
.ringwrap span{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:10px;color:var(--ink3);letter-spacing:.12em}
.milestones{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.milestones li{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);
  padding:3px 6px;border-radius:6px;cursor:pointer
}
.milestones li:hover{background:var(--accent-soft);color:var(--ink2)}
.milestones li i{
  width:12px;height:12px;border-radius:50%;border:1px solid var(--line2);flex:none;
  font-style:normal;font-size:9px;display:grid;place-items:center;color:transparent
}
.milestones li.done{color:var(--jade)}
.milestones li.done i{background:var(--jade);border-color:var(--jade);color:#fff}

.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.toc a,.toc button{
  font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--ink2)
}
.toc a:hover,.toc button:hover{border-color:var(--accent);color:var(--accent)}
.toc button.special{border-style:dashed;color:var(--jade);border-color:var(--jade-soft)}
.toc button.special:hover{border-color:var(--jade)}

.sec{padding:38px 0 6px;border-bottom:1px solid var(--line);scroll-margin-top:80px}
.sec:last-of-type{border-bottom:none}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.sec-num{
  font-family:var(--serif);font-size:13px;color:var(--accent);letter-spacing:.2em;
  border:1px solid var(--accent);border-radius:50%;width:26px;height:26px;
  display:grid;place-items:center;flex:none;line-height:1
}
.sec-h h2{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:.1em;margin:0}
.sec-sub{font-size:12.5px;color:var(--ink3);margin:0 0 20px 38px}
.lead{font-size:15px;color:var(--ink2);line-height:1.95;margin:0 0 18px;text-align:justify}

/* ruby */
.ruby-line{line-height:2.6}
ruby{ruby-position:over}
ruby rt{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:0;font-weight:400;opacity:.9}
html[data-hide-jp="1"] ruby rt{display:none}
html[data-hide-jp="1"] .ruby-line{line-height:1.75}

/* goals */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel h4{margin:0 0 10px;font-size:12px;letter-spacing:.16em;color:var(--ink3);font-weight:500;font-family:var(--sans)}
.panel ul{margin:0;padding-left:0;list-style:none}
.panel ul li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.85;color:var(--ink2)}
.panel ul li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;background:var(--accent);border-radius:1px;transform:rotate(45deg)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);margin-top:12px}
.flow i{font-style:normal;padding:3px 9px;background:var(--jade-soft);color:var(--jade);border-radius:5px}
.flow em{font-style:normal;color:var(--ink3);font-family:var(--mono)}

/* sentence card */
.sent{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px 14px;margin-bottom:10px;position:relative;
  transition:border-color .15s, box-shadow .15s;
}
.sent:hover{border-color:var(--line2)}
.sent.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sent.pinned{border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.sent-top{display:flex;gap:12px;align-items:flex-start}
.sent-no{font-family:var(--mono);font-size:11px;color:var(--ink3);padding-top:14px;width:22px;flex:none}
.sent-body{flex:1;min-width:0}
.sent-jp{
  font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.05em;
  line-height:1.6;margin-bottom:3px;overflow-wrap:anywhere;transition:color .18s
}
.sent-yue{font-family:var(--serif);font-size:21px;letter-spacing:.04em;color:var(--ink);line-height:1.6;transition:color .18s}
.sent-yue.playable{cursor:pointer}
html[data-hide-jp="1"] .sent-jp{display:none}
html[data-mask="hanzi"] .sent-yue:not(:hover){color:transparent}
html[data-mask="hanzi"] .sent-yue:hover{color:var(--ink2)}
html[data-mask="jp"] .sent-jp:not(:hover){color:transparent}
html[data-mask="jp"] .sent-jp:hover{color:var(--accent)}
.sent-cmn{
  font-size:13px;color:var(--ink3);margin-top:2px;line-height:1.6;
  padding-top:8px;border-top:1px dashed var(--line);
}
html[data-hide-cmn="1"] .sent-cmn{display:none}
.sent-tip{
  font-size:12.5px;color:var(--ink2);line-height:1.8;margin-top:10px;
  padding:9px 12px;background:var(--jade-soft);border-radius:8px;
}
.sent-tip::before{content:"要點";font-family:var(--mono);font-size:10px;color:var(--jade);letter-spacing:.14em;margin-right:8px}
.sent-act{display:flex;gap:5px;flex:none;padding-top:8px}
.icb{
  width:31px;height:31px;border-radius:8px;border:1px solid var(--line2);
  display:grid;place-items:center;color:var(--ink2);font-size:12px;background:var(--card)
}
.icb:hover{border-color:var(--accent);color:var(--accent)}
.icb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sent-note{display:none;margin-top:10px}
.sent-note.show{display:block}
.sent-note textarea{
  width:100%;min-height:62px;resize:vertical;border:1px solid var(--line2);border-radius:8px;
  background:var(--paper);color:var(--ink);padding:10px 12px;font-family:var(--sans);font-size:13px;line-height:1.7
}
.sent-note textarea:focus{outline:none;border-color:var(--accent)}

/* playbar */
.playbar{
  position:sticky;bottom:16px;z-index:15;margin-top:16px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line2);border-radius:999px;
  padding:7px 8px;box-shadow:0 6px 24px rgba(0,0,0,.07);width:fit-content;max-width:100%
}
.pb-main{
  display:flex;align-items:center;gap:7px;background:var(--accent);color:#fff;
  padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:.05em;white-space:nowrap
}
.pb-main:hover{filter:brightness(1.08)}
.pb-main.shadow{background:var(--jade)}
.pb-btn{font-size:12.5px;padding:6px 11px;border-radius:999px;color:var(--ink2);white-space:nowrap}
.pb-btn:hover{background:var(--accent-soft);color:var(--accent)}
.pb-btn.on{background:var(--ink);color:var(--paper)}
.pb-sep{width:1px;height:18px;background:var(--line);flex:none}

/* video */
.videocard{margin-top:26px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);scroll-margin-top:80px}
.video-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.video-head b{font-size:13.5px;font-weight:500;letter-spacing:.04em}
.video-head .vhint{font-size:12px;color:var(--ink3)}
.badge{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:3px 8px;border-radius:4px;
  background:var(--jade-soft);color:var(--jade)
}
.badge.lock{background:var(--accent-soft);color:var(--accent)}
.ratechips{margin-left:auto;display:flex;gap:4px}
.ratechips button{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink3)}
.ratechips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.video-stage{position:relative;background:#0E0D0B}
.video-stage video{display:block;width:100%;max-height:520px;background:#000}
.vid-err{padding:22px;color:#E0B4A8;font-size:13px;line-height:1.9;background:#1a1210}
.vid-err code{font-family:var(--mono);font-size:11px;color:#F0997B;word-break:break-all}
.lockmask{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:48px 24px;text-align:center;color:#CFC6B6;
  background:repeating-linear-gradient(45deg,#1a1815,#1a1815 10px,#22201c 10px,#22201c 20px)
}
.lockmask .lk{font-size:26px;opacity:.7}
.lockmask p{margin:0;font-size:13px;line-height:1.8;max-width:420px}
.lockmask .hint{font-size:12px;color:#8E8577}
.btn-solid{background:var(--accent);color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;letter-spacing:.05em}
.btn-solid:hover{filter:brightness(1.08)}
.video-foot{padding:12px 18px 14px;border-top:1px solid var(--line)}
.video-foot .vnote{font-size:12.5px;color:var(--ink3);line-height:1.85;margin:0 0 10px}
.markbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.markbar .mk{
  display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--jade);color:var(--jade);background:var(--jade-soft)
}
.markbar .mk:hover{background:var(--jade);color:#fff}
.markbar select{
  font-family:inherit;font-size:12px;padding:5px 8px;border-radius:8px;
  border:1px solid var(--line2);background:var(--paper);color:var(--ink2)
}
.markbar .mh{font-size:11.5px;color:var(--ink3)}
.marklist{margin-top:8px;display:grid;gap:5px}
.markrow{display:flex;gap:8px;align-items:center;font-size:12.5px}
.markrow .mt{font-family:var(--mono);font-size:11.5px;color:var(--accent);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;flex:none}
.markrow .mt:hover{border-color:var(--accent);background:var(--accent-soft)}
.markrow .ms{font-family:var(--mono);font-size:10.5px;color:var(--jade);flex:none}
.markrow input{
  flex:1;min-width:0;font-family:inherit;font-size:12.5px;padding:3px 8px;border-radius:6px;
  border:1px solid transparent;background:transparent;color:var(--ink2)
}
.markrow input:hover{border-color:var(--line)}
.markrow input:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.markrow .mx{color:var(--ink3);font-size:14px;flex:none}
.markrow .mx:hover{color:var(--accent)}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vcard{border:1px solid var(--line);border-radius:11px;padding:11px 14px 12px;background:var(--card);position:relative;cursor:pointer;transition:border-color .15s,background .15s}
.vcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.vtop{display:flex;align-items:baseline;gap:8px;min-width:0;padding-right:22px}
.vcard .vw{font-family:var(--serif);font-size:18px;letter-spacing:.04em;line-height:1.35}
.vcard .vj{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[data-hide-jp="1"] .vcard .vj{display:none}
.vcard .vc{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.55}
.vcard .vx{font-size:11px;color:var(--ink3);margin-top:2px;font-style:normal;line-height:1.5}

.vcard .star{position:absolute;top:8px;right:9px;color:var(--ink3);font-size:14px;padding:0 2px;line-height:1}
.vcard .star.on{color:var(--gold)}
.numrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.numcell{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;text-align:center;min-width:56px;cursor:pointer}
.numcell:hover{border-color:var(--accent)}
.numcell b{display:block;font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.3}
.numcell i{display:block;font-family:var(--mono);font-size:10.5px;color:var(--accent);font-style:normal}
.numcell u{display:block;font-size:10.5px;color:var(--ink3);text-decoration:none}

/* knowledge */
.kcard{border-left:2px solid var(--accent);padding:2px 0 2px 18px;margin-bottom:26px}
.kcard h3{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.05em;margin:0 0 8px}
.kcard p{margin:0 0 10px;font-size:14px;line-height:1.9;color:var(--ink2);text-align:justify}
.exlist{display:grid;gap:6px;margin-top:10px}
.ex{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr) auto;gap:10px;
  align-items:center;padding:8px 12px;border-radius:8px;
  background:var(--paper);border:1px solid var(--line);font-size:13.5px
}
.exm{display:flex;flex-direction:column;min-width:0}
.ex .ey{font-family:var(--serif);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.ex .ej{font-family:var(--mono);font-size:10.5px;color:var(--accent);opacity:.85;line-height:1.5;overflow-wrap:anywhere}
html[data-hide-jp="1"] .ex .ej{display:none}
html[data-hide-cmn="1"] .ex{grid-template-columns:minmax(0,1fr) auto}
html[data-hide-cmn="1"] .ex .ec{display:none}
.ex .ec{color:var(--ink3);font-size:12.5px;text-align:right;overflow-wrap:anywhere}
.ex .eb{padding:2px 8px;border-radius:5px;border:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.ex .eb:hover{border-color:var(--accent);color:var(--accent)}
.ex.clickable{cursor:pointer;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);transition:border-color .15s,background .15s}
.ex.clickable:hover{border-color:var(--line2);background:var(--accent-soft)}
.ex.clickable.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
td.clickable{cursor:pointer}
td.clickable:hover{background:var(--accent-soft);color:var(--accent)}

/* tone table */
table.tone{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}
table.tone th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.06em;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tone td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tone tr:last-child td{border-bottom:none}
.tone-no{font-family:var(--mono);color:var(--accent);font-weight:600;font-size:15px}
.tone-val{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.tone-ex{font-family:var(--serif);font-size:17px}
.tone-desc{font-size:12.5px;color:var(--ink3)}
.cmp{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.cmpcell{border:1px solid var(--line);border-radius:9px;padding:7px 12px;text-align:center;background:var(--card);cursor:pointer}
.cmpcell:hover{border-color:var(--accent)}
.cmpcell b{display:block;font-family:var(--serif);font-size:19px;font-weight:500}
.cmpcell i{display:block;font-family:var(--mono);font-size:10.5px;color:var(--accent);font-style:normal}
.note-line{font-size:12.5px;color:var(--ink3);line-height:1.85;padding:10px 14px;border-left:2px solid var(--line2);margin:14px 0}

/* exercises */
.quizbar{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.quizbar b{font-family:var(--mono);color:var(--ink)}
.quizbar .qreset{font-size:12px;padding:3px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--ink2)}
.quizbar .qreset:hover{border-color:var(--accent);color:var(--accent)}
.q{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--card)}
.q .qh{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.q .qn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--jade);background:var(--jade-soft);padding:2px 8px;border-radius:4px;flex:none}
.q .qt{font-size:14px;line-height:1.7}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{
  text-align:left;padding:9px 14px;border:1px solid var(--line2);border-radius:9px;
  font-size:13.5px;color:var(--ink2);background:var(--paper);font-family:var(--serif);letter-spacing:.03em
}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.why{display:none;margin-top:10px;font-size:12.5px;color:var(--ink2);line-height:1.8;padding:9px 12px;background:var(--paper);border-radius:8px;border:1px dashed var(--line2)}
.why.show{display:block}

/* 右側豎向目錄 */
.wrap.with-toc{
  max-width:1000px;display:grid;
  grid-template-columns:minmax(0,1fr) 184px;column-gap:30px;
  align-items:start
}
.wrap.with-toc .hero{grid-column:1 / -1}
.lesson-body{grid-column:1;min-width:0}
.toc-side{
  grid-column:2;align-self:start;position:sticky;top:88px;
  max-height:calc(100vh - 116px);overflow-y:auto;padding:4px 0 12px;
  scrollbar-width:thin
}
.ts-h{
  font-size:10.5px;letter-spacing:.18em;color:var(--ink3);
  margin-bottom:8px;padding-left:11px
}
.ts-item{
  display:block;font-size:12.5px;line-height:1.45;color:var(--ink3);
  padding:5px 10px 5px 11px;border-left:2px solid var(--line);
  text-decoration:none;transition:color .15s,border-color .15s,background .15s
}
.ts-item:hover{color:var(--ink);border-left-color:var(--line2);background:var(--accent-soft)}
.ts-item.on{color:var(--accent);border-left-color:var(--accent);font-weight:500}

@media (max-width:1180px){
  .wrap.with-toc{display:block;max-width:920px}
  .toc-side{display:none}
}

/* passage */
.passage{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:16px 18px 10px}
.passage-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.passage-head b{font-size:12.5px;letter-spacing:.08em;color:var(--ink3);font-weight:500}
.pb-mini{margin-left:auto;font-size:12px;padding:5px 14px;border-radius:999px;background:var(--accent);color:#fff}
.pb-mini:hover{filter:brightness(1.08)}
.plines{list-style:none;margin:0;padding:0}
.pline{
  display:flex;gap:12px;align-items:flex-start;padding:11px 14px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:10px;background:var(--paper);
  transition:border-color .15s, box-shadow .15s
}
.pline:hover{border-color:var(--line2)}
.pline.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pline .pl-no{font-family:var(--mono);font-size:11px;color:var(--ink3);width:14px;flex:none;padding-top:12px}
.pline .pl-body{flex:1;min-width:0}
.pline .pl-yue{font-family:var(--serif);font-size:19px;letter-spacing:.03em;line-height:1.6;transition:color .18s}
html[data-mask="hanzi"] .pline .pl-yue:not(:hover){color:transparent}
html[data-mask="hanzi"] .pline .pl-yue:hover{color:var(--ink2)}

/* notes */
.notebox textarea{
  width:100%;min-height:150px;border:1px solid var(--line2);border-radius:12px;
  background:var(--card);color:var(--ink);padding:16px 18px;
  font-family:var(--sans);font-size:14px;line-height:1.9;resize:vertical
}
.notebox textarea:focus{outline:none;border-color:var(--accent)}
.notebar{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink3);flex-wrap:wrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;background:var(--paper);
  border-left:1px solid var(--line2);z-index:41;transform:translateX(102%);
  transition:transform .26s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.08)
}
.drawer.on{transform:none}
.drawer-h{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-h b{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.1em}
.drawer-h button{margin-left:auto;font-size:20px;color:var(--ink3)}
.drawer-b{padding:16px 22px 40px;overflow-y:auto;flex:1}
.witem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.witem b{font-family:var(--serif);font-size:18px;font-weight:500}
.witem p{margin:2px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.7}
.witem button{margin-left:auto;color:var(--ink3);font-size:15px;flex:none}
.witem button:hover{color:var(--accent)}
.empty{color:var(--ink3);font-size:13px;text-align:center;padding:48px 0;line-height:1.9}

/* lightbox */
.lightbox{
  position:fixed;inset:0;z-index:50;background:rgba(18,16,13,.9);
  display:none;flex-direction:column;padding:18px
}
.lightbox.on{display:flex}
.lb-bar{display:flex;align-items:center;gap:12px;color:#D8CFBE;font-size:13px;font-family:var(--mono);letter-spacing:.1em;padding:0 4px 12px}
.lb-bar button{margin-left:auto;color:#D8CFBE;font-size:22px;line-height:1}
.lb-body{flex:1;min-height:0;display:grid;place-items:center;overflow:auto}
.lb-body img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px}
.lb-nav{display:flex;justify-content:center;gap:10px;padding-top:12px}
.lb-nav button{
  color:#D8CFBE;font-size:13px;padding:6px 16px;border:1px solid rgba(216,207,190,.3);border-radius:999px
}
.lb-nav button:hover{border-color:#D8CFBE;background:rgba(216,207,190,.1)}

/* 懸浮朗讀球 */
.fball{position:fixed;right:22px;bottom:22px;z-index:56;display:none}
.fball.on{display:block}
.fb-ball{
  width:56px;height:56px;border-radius:50%;background:var(--ink);position:relative;
  display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.24);
  transition:transform .15s
}
.fb-ball:hover{transform:scale(1.06)}
.fb-ring{position:absolute;inset:0;width:56px;height:56px;pointer-events:none}
.fb-bars{display:flex;gap:3px;align-items:flex-end;height:15px}
.fb-bars i{width:3px;border-radius:2px;background:var(--paper);height:9px;animation:fbwave .9s ease-in-out infinite}
.fb-bars i:nth-child(1){animation-delay:0s}
.fb-bars i:nth-child(2){animation-delay:.15s}
.fb-bars i:nth-child(3){animation-delay:.3s}
@keyframes fbwave{0%,100%{height:5px}50%{height:15px}}
body.fb-paused .fb-bars i{animation-play-state:paused;height:7px}
.fb-panel{
  position:absolute;right:0;bottom:70px;width:292px;background:var(--card);
  border:1px solid var(--line2);border-radius:14px;padding:12px 14px 11px;
  box-shadow:0 14px 40px rgba(0,0,0,.18);display:none
}
.fball.expanded .fb-panel{display:block}
.fb-head{display:flex;align-items:center;font-size:11px;color:var(--ink3);letter-spacing:.05em;margin-bottom:7px}
.fb-head .fb-loc{margin-left:auto;font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:1px 9px;color:var(--ink3)}
.fb-head .fb-loc:hover{border-color:var(--accent);color:var(--accent)}
.fb-text{
  font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--ink);
  max-height:76px;overflow:hidden;margin-bottom:10px;word-break:break-word
}
.fb-ctrl{display:flex;gap:6px;align-items:center}
.fb-ctrl button{
  flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);
  color:var(--ink2);font-size:13px;display:grid;place-items:center
}
.fb-ctrl button:hover{border-color:var(--accent);color:var(--accent)}
.fb-ctrl .fb-play{background:var(--accent);border-color:var(--accent);color:#fff;flex:1.5}
.fb-ctrl .fb-play:hover{filter:brightness(1.08);color:#fff}
body.fb-on .playbar{bottom:86px}
@media (max-width:620px){
  .fb-panel{width:min(280px,calc(100vw - 44px))}
  .fball{right:16px;bottom:16px}
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:60;
  background:var(--ink);color:var(--paper);padding:9px 20px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .25s;max-width:80vw;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* home */
.home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.hcard{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card)}
.hcard b{display:block;font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:4px}
.hcard p{margin:0;font-size:12.5px;color:var(--ink3);line-height:1.7}

.foot{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);line-height:1.9}

/* dialogue */
.dlg-scene{font-size:13px;color:var(--ink3);margin:0 0 14px;padding:9px 14px;background:var(--card);border:1px solid var(--line);border-radius:9px}
.dlgs{display:grid;gap:8px}
.dline{
  display:flex;gap:12px;align-items:flex-start;padding:12px 16px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  transition:border-color .15s, box-shadow .15s
}
.dline:hover{border-color:var(--line2)}
.dline.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dspk{
  flex:none;min-width:44px;padding:2px 9px;border-radius:6px;text-align:center;
  font-size:11.5px;font-family:var(--mono);letter-spacing:.04em;margin-top:12px
}
.dline.a .dspk{background:var(--accent-soft);color:var(--accent)}
.dline.b .dspk{background:var(--jade-soft);color:var(--jade)}
.dline.c .dspk{background:var(--line);color:var(--ink2)}
.dline .dbody{flex:1;min-width:0}
.dline .dyue{font-family:var(--serif);font-size:19px;letter-spacing:.03em;line-height:1.6;transition:color .18s}
.dline .dyue.playable{cursor:pointer}
html[data-mask="hanzi"] .dline .dyue:not(:hover){color:transparent}
html[data-mask="hanzi"] .dline .dyue:hover{color:var(--ink2)}

.supgroup{margin-bottom:16px}
.supgroup h4{margin:0 0 8px;font-size:12px;letter-spacing:.14em;color:var(--ink3);font-weight:500}

/* 區塊朗讀 */
.sec-read{
  margin-left:auto;font-size:11.5px;padding:3px 11px;border-radius:999px;
  border:1px solid var(--line2);color:var(--ink3);white-space:nowrap;letter-spacing:.02em
}
.sec-read:hover{border-color:var(--accent);color:var(--accent)}
.sec-read.on{background:var(--accent);border-color:var(--accent);color:#fff}
.k-read{
  float:right;margin-left:10px;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--line2);color:var(--ink3);font-size:10px;
  display:inline-grid;place-items:center;vertical-align:middle
}
.k-read:hover{border-color:var(--accent);color:var(--accent)}
.k-read.on{background:var(--accent);border-color:var(--accent);color:#fff}
.reading{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft);border-radius:4px}
html[data-theme="dark"] .reading{background:#33211A;box-shadow:0 0 0 4px #33211A}

/* home mini list */
.minilist{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.mini{
  font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);
  color:var(--ink2);background:var(--paper)
}
.mini:hover{border-color:var(--accent);color:var(--accent)}

@media (max-width:1080px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .sidebar.open{
    display:block;position:fixed;top:0;left:0;bottom:0;width:280px;height:100vh;z-index:45;
    box-shadow:12px 0 40px rgba(0,0,0,.18);border-right:1px solid var(--line2)
  }
  .menu-btn{display:grid}
  .wrap,.topbar-in{padding-left:22px;padding-right:22px}
  .hero h1{font-size:40px}
  .hero-top{flex-direction:column;gap:18px}
  .hero-side{width:100%;display:flex;gap:20px;align-items:center}
  .ringwrap{margin-bottom:0;flex:none}
  .grid2,.home-cards{grid-template-columns:1fr}
  .ex{grid-template-columns:minmax(0,1fr) auto}
  .ex .ec{text-align:left;grid-column:1/-1}
  table.tone{font-size:12px}
  table.tone th,table.tone td{padding:7px 5px}
  .tone-desc{font-size:11.5px}
}
@media (max-width:560px){
  /* 窄屏保持兩列：22 條詞彙排成 22 行要滑很久，兩列才實用 */
  .vgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .vcard{padding:9px 11px 10px}
  .vcard .vw{font-size:16px}
  .vcard .vj{font-size:9.5px}
  .vcard .vc{font-size:11.5px;margin-top:3px}
  .vcard .vx{font-size:10px}
  /* 粵拼行在手機上太搶眼，壓小一檔，讓漢字回到主角 */
  .sent-jp{font-size:10.5px;line-height:1.5;letter-spacing:.02em}
  .sent-yue{font-size:19px}
  .pline .sent-jp{font-size:10px}
}
@media (max-width:359px){
  .vgrid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .chip-tools .tool[data-act="t-jp"],.chip-tools .tool[data-act="t-cmn"]{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

/* 語音設定面板 */
.vovl{position:fixed;inset:0;background:rgba(20,16,12,.42);z-index:120;display:none}
.vovl.on{display:block}
.vpanel{
  position:fixed;z-index:121;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,92vw);max-height:82vh;overflow:auto;
  background:var(--card);border:1px solid var(--line2);border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);padding:22px 24px 18px;display:none
}
.vpanel.on{display:block}
.vpanel h3{margin:0 0 6px;font-size:17px;font-weight:600;color:var(--ink)}
.vpanel .vsub{font-size:12.5px;line-height:1.8;color:var(--ink3);margin:0 0 16px}
.vgroup{margin-bottom:16px}
.vgroup h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.vopt{
  display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);margin-bottom:6px;font-size:13px;color:var(--ink2)
}
.vopt:hover{border-color:var(--line2)}
.vopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.vopt .vdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);flex:none}
.vopt.on .vdot{border-color:var(--accent);background:var(--accent)}
.vopt .vn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vopt .vl{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:none}
.vwarn{font-size:12px;line-height:1.8;color:#9a4a2f;background:#fbf1ec;border:1px solid #f0d8cc;
  border-radius:9px;padding:9px 12px;margin:6px 0 0}
.vfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.vbtn{padding:8px 18px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
  color:var(--ink2);font-size:13px;cursor:pointer}
.vbtn.main{background:var(--accent);border-color:var(--accent);color:#fff}

/* 全站搜索 */
.srchbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.srchin{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  font-family:inherit;font-size:15px;background:var(--card);color:var(--ink)}
.srchin:focus{outline:none;border-color:var(--accent)}
.srchres{min-height:60px}
.srch-h{margin:18px 0 8px;font-size:12.5px;color:var(--ink3);letter-spacing:.04em}
.srchlist{display:flex;flex-direction:column;gap:6px}
.sritem{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card);cursor:pointer}
.sritem:hover{border-color:var(--line2);background:var(--accent-soft)}
.sritem b{font-size:14.5px;font-weight:600}
.sritem em{font-family:var(--mono);font-size:11px;color:var(--accent);font-style:normal;flex:0 0 auto}
.sritem i{font-style:normal;font-size:11.5px;color:var(--ink3);margin-left:auto}
.sritem .srt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:0 0 42px}
.sritem .src{font-size:12px;color:var(--ink2);margin-left:auto;max-width:46%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srsent b{font-weight:500}
.flash{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
@media (max-width:560px){
  .sritem{flex-wrap:wrap;gap:4px 8px}
  .sritem .src{max-width:100%;margin-left:0;flex-basis:100%}
}
/* 聽力練習 */
.lq-bar{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.lq-bar .spacer{flex:1}
.lq-card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card)}
.lq-play{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lq-big{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;line-height:1}
.lq-big:hover{filter:brightness(1.06)}
.lq-opts{display:flex;flex-direction:column;gap:8px}
.lq-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14.5px;cursor:pointer}
.lq-opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.lq-opt b{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:0 0 18px}
.lq-opt.right{border-color:var(--jade);background:var(--jade-soft)}

<script>
(function(){
"use strict";

/* ============ 數據 ============ */
var DATA = window.LESSONS || {};
var C = window.COURSE || {volumes:[]};
var CUR = null, LID = "";

/* ============ 存儲 ============ */
var mem = {};
var STORE_OK = true;
try { localStorage.setItem("yue.__t","1"); localStorage.removeItem("yue.__t"); }
catch(e){ STORE_OK = false; }
var DB = {
  get:function(k,d){
    try{
      var raw = STORE_OK ? localStorage.getItem("yue."+k) : mem[k];
      if(raw===null||raw===undefined) return d;
      return JSON.parse(raw);
    }catch(e){ return d; }
  },
  set:function(k,v){
    var s = JSON.stringify(v);
    if(STORE_OK){ try{ localStorage.setItem("yue."+k,s); }catch(e){ mem[k]=s; } }
    else { mem[k]=s; }
  }
};

var state = {
  view:"lesson",
  last: DB.get("last", null),
  prefs: DB.get("prefs", {jp:true, cmn:true, theme:"light", rate:"normal", shadow:false, mask:"", explain:"yue"}),
  notes: DB.get("notes", {lesson:{}, sent:{}}),
  words: DB.get("words", []),
  prog:  DB.get("prog", {}),
  quiz:  DB.get("quiz", {}),
  marks: DB.get("marks", [])
};
if(!state.prefs.mask) state.prefs.mask = "";
if(state.prefs.explainV !== 2){ state.prefs.explain = "yue"; state.prefs.explainV = 2; DB.set("prefs", state.prefs); }

/* 生詞的間隔重複欄位：老數據只有 {w,jp,cmn,ex,at}，這裡一次性補齊 */
(function migrateWords(){
  var t = Date.now(), changed = false;
  state.words.forEach(function(w){
    if(typeof w.box !== "number"){ w.box = 1; changed = true; }
    if(typeof w.due !== "number"){ w.due = t; changed = true; }
    if(typeof w.ok !== "number"){ w.ok = 0; changed = true; }
    if(typeof w.bad !== "number"){ w.bad = 0; changed = true; }
  });
  if(changed) DB.set("words", state.words);
})();

/* ============ 小工具 ============ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function pad3(n){ return String(n).padStart(3,"0"); }
function CN(n){
  var d = "〇一二三四五六七八九";
  if(n<=9) return d.charAt(n);
  if(n===10) return "十";
  if(n<20) return "十"+d.charAt(n-10);
  return (n<30 ? "二十"+d.charAt(n-20) : String(n));
}
function fmtTime(t){
  t = Math.max(0, Math.floor(t||0));
  return pad2(Math.floor(t/60))+":"+pad2(t%60);
}
var toastT;
function toast(msg){
  var t = $("#toast"); if(!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); },2000);
}
function ruby(tokens){
  if(!tokens) return "";
  return tokens.map(function(p){
    var c = p[0], j = p[1];
    if(!j) return c===" " ? "&#8202;" : esc(c);
    return "<ruby>"+esc(c)+"<rt>"+j+"</rt></ruby>";
  }).join("");
}
function splitSent(text){
  return String(text||"")
    .split(/(?<=[。！？；!?;])|\n+/)
    .map(function(x){ return x.trim(); })
    .filter(function(x){ return x.length > 0; });
}

function lessonById(no){ return DATA["L"+pad2(no)] || null; }
function firstReady(){
  var arr = Object.keys(DATA).map(function(k){ return DATA[k]; }).sort(function(a,b){ return a.no-b.no; });
  return arr.length ? arr[0].no : null;
}
function pageList(L){
  var m = String((L&&L.pages)||"").match(/(\d+)\D+(\d+)/);
  if(!m) return [];
  var a = +m[1], b = +m[2], out = [];
  for(var i=a;i<=b;i++) out.push(i);
  return out;
}

/* ============ 音頻 / TTS（統一隊列） ============ */
var player = new Audio();
player.preload = "auto";

var tts = {
  gen:0, voices:[], q:[], i:0, paused:false, mode:null,
  curEl:null, curCls:"playing", gap:240, name:"", onEnd:null,

  load:function(){
    if(!("speechSynthesis" in window)) return;
    var self=this;
    var take=function(){ self.voices = window.speechSynthesis.getVoices() || []; };
    take();
    window.speechSynthesis.onvoiceschanged = take;
  },
  pick:function(lang){
    var vs = this.voices || [];
    var pref = (lang==="cmn") ? state.prefs.voiceCmn : state.prefs.voiceYue;
    if(pref && pref!=="auto"){
      var chosen = vs.filter(function(v){ return v.name===pref; })[0];
      if(chosen) return chosen;
    }
    var want = lang==="cmn"
      ? ["zh-CN","zh-Hans-CN","zh-SG"]
      : ["yue","yue-Hant-HK","zh-HK","zh-Hant-HK","zh-TW"];
    for(var i=0;i<want.length;i++){
      var tag = want[i].toLowerCase();
      var m = vs.filter(function(v){ return String(v.lang||"").toLowerCase()===tag; });
      if(m.length) return m[0];
    }
    if(lang==="cmn") return vs.filter(function(v){ return /^zh/i.test(v.lang||""); })[0] || null;
    var c = vs.filter(function(v){ return /cantonese|粵語|粤语/i.test(v.name||""); });
    return c.length ? c[0] : null;
  },
  ready:function(cb, tries){
    var self = this;
    if((this.voices && this.voices.length) || (tries||0) >= 5){ cb(); return; }
    this.voices = ("speechSynthesis" in window) ? (window.speechSynthesis.getVoices() || []) : [];
    if(this.voices.length){ cb(); return; }
    setTimeout(function(){ self.ready(cb, (tries||0)+1); }, 150);
  },

  start:function(items, opts){
    opts = opts || {};
    var vnow = $("#vid");
    if(vnow && !vnow.paused){ try{ vnow.pause(); }catch(e){} }
    this.gen++;
    this._clearCur();
    try{ player.pause(); player.removeAttribute("src"); }catch(e){}
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    this.q = (items||[]).filter(function(x){ return x && (x.audio || x.text); });
    this.i = 0;
    this.paused = false;
    this.gap = opts.gap===undefined ? 240 : opts.gap;
    this.name = opts.name || "朗讀";
    this.onEnd = opts.onEnd || null;
    if(!this.q.length){ this._finish(); return; }
    fballShow();
    this._step(this.gen);
  },
  _step:function(my){
    var self = this;
    if(this.gen !== my) return;
    if(this.i >= this.q.length){ this._finish(); return; }
    var it = this.q[this.i];
    this.mode = it.audio ? "audio" : "say";
    this._setCur(it);
    fballUpdate();
    var done = function(){
      if(self.gen !== my) return;
      self.i++;
      if(self.gap > 300) setTimeout(function(){ self._step(my); }, self.gap);
      else self._step(my);
    };
    if(it.audio) this._audio(it, my, done);
    else this._sayItem(it, my, done);
  },
  _audio:function(it, my, done){
    var self = this;
    var src = (state.prefs.rate==="slow" && it.slow) ? it.slow : it.audio;
    var fb = function(){ if(self.gen!==my) return; self._sayItem(it, my, done); };
    player.src = src;
    player.onended = function(){ if(self.gen!==my) return; done(); };
    player.onerror = fb;
    var pr = player.play();
    if(pr && pr.catch) pr.catch(fb);
  },
  _sayItem:function(it, my, done){
    var self = this;
    var text = it.text || "";
    if(!text){ done(); return; }
    var lang = it.lang || "yue";
    var tries = it._try || 0;
    this.ready(function(){
      if(self.gen !== my) return;
      if(!("speechSynthesis" in window)){ done(); return; }
      var v = self.pick(lang);
      if(!v){
        /* 沒有粵語音色時退回任何中文音色，避免整段朗讀直接啞掉 */
        v = (self.voices||[]).filter(function(x){ return /^zh/i.test(x.lang||""); })[0] || null;
        if(v) toast("找不到粵語音色，暫用其他中文音色");
      }
      var u = new SpeechSynthesisUtterance(text);
      if(v){ u.voice = v; u.lang = v.lang; }
      u.rate = state.prefs.rate==="slow" ? 0.8 : 0.98;
      u.volume = 1;

      /* 連續朗讀三個坑：
         1) onend 內同步 speak 下一句會被瀏覽器吞掉 → 延 90ms；
         2) 短句 onend 有時不觸發 → 看門狗按字數估時長強制推進；
         3) utterance 被 GC 會直接靜音（高亮照走、沒有聲音）→ 用 _lastU 一直握住參考，
            並且播出去 700ms 後若引擎仍是閒置狀態，就重試一次。 */
      var fired = false;
      var wd = null;
      var next = function(){
        if(fired) return;
        fired = true;
        self._lastU = null;
        if(wd) clearTimeout(wd);
        setTimeout(function(){ if(self.gen===my) done(); }, 90);
      };
      self._lastU = u;                       /* 防 GC */
      var started = false;
      wd = setTimeout(next, Math.max(5000, text.length * 280));
      u.onstart = function(){ started = true; };   /* 真正出聲才算起播 */
      u.onend = next;
      u.onerror = next;

      /* 關鍵：Edge/Chrome 在上一個 utterance 剛結束、引擎還沒收拾乾淨時直接 speak，
         會出現「沒有聲音也沒有 onend」的死局（高亮照走、音全無）。
         標準解法是先 cancel 清空隊列，隔一拍再 speak。 */
      var ss = window.speechSynthesis;
      try{ if(ss.speaking || ss.pending) ss.cancel(); }catch(e){}
      setTimeout(function(){
        if(self.gen !== my || fired) return;
        try{ ss.speak(u); }catch(e){ next(); }
      }, 140);

      /* 起播檢測：900ms 內沒收到 onstart（等於沒出聲），重試一次。
         注意不能靠 speechSynthesis.speaking —— 它常常在靜音狀態下也回 true。 */
      setTimeout(function(){
        if(self.gen!==my || fired || started) return;
        if(tries >= 2){                       /* 重試兩次仍失敗 → 提示一次，交給看門狗推進 */
          if(!self._warned){
            self._warned = true;
            toast("這個瀏覽器的語音引擎沒有回應，這一段可能沒有聲音");
          }
          return;
        }
        it._try = tries + 1;
        clearTimeout(wd);
        self._sayItem(it, my, done);
      }, 900);
    });
  },
  _setCur:function(it){
    this._clearCur();
    var el = it.el || (it.key ? $('[data-key="'+it.key+'"]') : null);
    this.curEl = el;
    this.curCls = it.cls || "playing";
    if(el) el.classList.add(this.curCls);
  },
  _clearCur:function(){
    this.curEl = null;
    $$(".reading").forEach(function(el){ el.classList.remove("reading"); });
    $$(".sent.playing").forEach(function(el){ el.classList.remove("playing"); });
  },
  _finish:function(){
    var cb = this.onEnd, many = this.q.length > 1;
    this._clearCur();
    this.q = []; this.i = 0; this.paused = false; this.onEnd = null;
    fballHide();
    if(many) toast("朗讀完畢");
    if(cb) cb();
  },

  stop:function(){
    this.gen++;
    this._clearCur();
    try{ player.pause(); player.removeAttribute("src"); }catch(e){}
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    this.q = []; this.i = 0; this.paused = false; this.onEnd = null;
    fballHide();
    $$(".sec-read.on, .k-read.on").forEach(function(b){ b.classList.remove("on"); });
  },
  pause:function(){
    if(!this.q.length || this.paused) return;
    this.paused = true;
    if(this.mode==="audio"){ try{ player.pause(); }catch(e){} }
    else if("speechSynthesis" in window) window.speechSynthesis.pause();
    fballUpdate();
  },
  resume:function(){
    if(!this.q.length || !this.paused) return;
    this.paused = false;
    if(this.mode==="audio"){ var pr = player.play(); if(pr && pr.catch) pr.catch(function(){}); }
    else if("speechSynthesis" in window) window.speechSynthesis.resume();
    fballUpdate();
  },
  toggle:function(){ this.paused ? this.resume() : this.pause(); },
  jump:function(n){
    if(!this.q.length) return;
    n = Math.max(0, Math.min(n, this.q.length-1));
    var my = ++this.gen;
    try{ player.pause(); }catch(e){}
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    this._clearCur();
    this.i = n; this.paused = false;
    this._step(my);
  },
  next:function(){ this.jump(this.i + 1); },
  prev:function(){ this.jump(this.i - 1); },
  current:function(){ return this.q[this.i] || null; },
  total:function(){ return this.q.length; }
};

function playSentence(s){
  tts.start([{key:s.id, audio:s.audio, slow:s.audioSlow, text:s.yue}], {name:"課文"});
}
function playPlain(text, el, name, audio){
  tts.start([{text:text, el:el, lang:"yue", audio:audio||null}], {name:name||"朗讀"});
}

/* ============ 懸浮朗讀球 ============ */
function fballShow(){
  var el = $("#fball"); if(!el) return;
  el.classList.add("on");
  document.body.classList.add("fb-on");
}
function fballHide(){
  var el = $("#fball"); if(!el) return;
  el.classList.remove("on");
  el.classList.remove("expanded");
  document.body.classList.remove("fb-on");
  document.body.classList.remove("fb-paused");
}
function fballUpdate(){
  var el = $("#fball"); if(!el) return;
  if(!tts.q.length){ fballHide(); return; }
  fballShow();
  var it = tts.current() || {};
  var txt = String(it.text || "").replace(/\s+/g," ").trim();
  if(txt.length > 46) txt = txt.slice(0,46) + "…";
  var lab = $("#fb-label"), tx = $("#fb-text"), ic = $("#fb-icon"), rg = $("#fb-ring");
  if(lab) lab.textContent = tts.name + "　" + (tts.i+1) + " / " + tts.total();
  if(tx) tx.textContent = txt || "—";
  if(ic) ic.textContent = tts.paused ? "▶" : "❚❚";
  document.body.classList.toggle("fb-paused", !!tts.paused);
  if(rg){
    var C2 = 2*Math.PI*18;
    var pct = tts.total() ? (tts.i / tts.total()) : 0;
    rg.setAttribute("stroke-dasharray", C2.toFixed(1));
    rg.setAttribute("stroke-dashoffset", (C2*(1-pct)).toFixed(1));
  }
}


/* ============ 進度 ============ */
function progOf(id){ return state.prog[id] || {}; }
function quizScore(id, L){
  var a = state.quiz[id] || {}, n=0;
  var total = (L && L.exercises) ? L.exercises.length : 0;
  Object.keys(a).forEach(function(k){ if(a[k] && a[k].ok) n++; });
  return {right:n, answered:Object.keys(a).length, total:total};
}
function milestones(L){
  var p = progOf(L.id), q = quizScore(L.id, L);
  var hasNote = !!(state.notes.lesson[L.id] && state.notes.lesson[L.id].trim()) ||
                Object.keys(state.notes.sent).some(function(k){ return k.indexOf(L.id)===0 && state.notes.sent[k]; });
  var secs = L.sections || [];
  var idxEx = secs.indexOf("exercises");
  var ms = [{k:"read", label:"讀完課文", done:!!p.read, to:"s1"}];
  if(L.video) ms.push({k:"watched", label:"看完影片", done:!!p.watched, to:"video"});
  if(q.total) ms.push({k:"quiz", label:"練習全對", done:q.right===q.total, to:"s"+(idxEx+1)});
  ms.push({k:"note", label:"寫下筆記", done:hasNote, to:"notes"});
  return ms;
}
function renderRing(){
  if(!CUR) return "";
  var ms = milestones(CUR), n = ms.filter(function(m){return m.done;}).length, total = ms.length;
  var C2 = 2*Math.PI*18, off = C2*(1-n/total);
  var html = '<div class="ringwrap">'
    + '<svg viewBox="0 0 44 44" aria-hidden="true">'
    + '<circle cx="22" cy="22" r="18" fill="none" stroke="var(--line)" stroke-width="3.5"/>'
    + '<circle cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="3.5"'
    + ' stroke-linecap="round" stroke-dasharray="'+C2.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"'
    + ' transform="rotate(-90 22 22)" style="transition:stroke-dashoffset .4s"/>'
    + '</svg><b>'+n+'/'+total+'</b></div>'
    + '<ul class="milestones">'
    + ms.map(function(m){
        return '<li class="'+(m.done?"done":"")+'" data-act="jump" data-to="'+m.to+'">'
          + '<i>'+(m.done?"✓":"")+'</i>'+esc(m.label)+'</li>';
      }).join("")
    + '</ul>';
  return html;
}
function refreshRing(){
  var box = $("#herosize");
  if(box) box.innerHTML = renderRing();
}

var READ_SEL = "h3, p, li, .ey, .pl-yue, .dyue, .sent-yue, .note-line, .dlg-scene, .sent-tip, .lead";

function collectBlocks(root){
  var out = [];
  $$(READ_SEL, root).forEach(function(el){
    if(el.closest(".foot") || el.closest(".playbar") || el.closest(".videocard")) return;
    if(el.closest(".ex") && el.classList.contains("ec")) return;
    var txt;
    if(el.tagName === "H3" && el.firstChild && el.firstChild.nodeType === 3){
      txt = el.firstChild.textContent;
    } else {
      txt = el.textContent;
    }
    txt = String(txt||"").replace(/\s+/g, " ").trim();
    if(txt.length < 2) return;
    var cn = " "+el.className+" ";
    var isYue = /\s(ey|pl-yue|dyue|sent-yue)\s/.test(cn);
    /* 預生成音頻：粵語例句任何時候都用；講解正文只在「講解：粵」時用，
       切成「講解：普」就該老老實實用普通話音色，不能被粵語 mp3 覆蓋。 */
    var auEl = el.closest("[data-audio]");
    var au = auEl ? auEl.getAttribute("data-audio") : "";
    var wantAudio = isYue || (state.prefs.explain||"yue") === "yue";
    out.push({el:el, text:txt, audio: (wantAudio ? (au||null) : null),
              lang: isYue ? "yue" : (state.prefs.explain||"cmn")});
  });
  return out;
}

/* ============ 語音設定面板 ============ */
function voiceGroups(){
  var vs = (tts.voices || []).slice();
  function isYue(v){
    var s = (v.lang||"") + " " + (v.name||"");
    return /yue|cantonese|zh[-_]hk|粵語|粤语/i.test(s);
  }
  var yue = vs.filter(isYue);
  var cmn = vs.filter(function(v){
    if(isYue(v)) return false;
    var s = (v.lang||"") + " " + (v.name||"");
    return /zh[-_](cn|sg|tw|hans|hant)|chinese|中文|國語|普通话|普通話/i.test(s);
  });
  function rank(v){ return /natural|online|neural/i.test(v.name||"") ? 0 : 1; }
  return { yue: yue.sort(function(a,b){ return rank(a)-rank(b); }),
           cmn: cmn.sort(function(a,b){ return rank(a)-rank(b); }) };
}

function voiceRow(kind, name, label, lang, checked){
  return '<div class="vopt'+(checked?" on":"")+'" data-act="voice-pick" data-kind="'+kind+'"'
    + ' data-name="'+esc(name)+'">'
    + '<span class="vdot"></span>'
    + '<span class="vn">'+esc(label)+'</span>'
    + '<span class="vl">'+esc(lang||"")+'</span></div>';
}

function renderVoicePanel(){
  var box = $("#vbody");
  if(!box) return;
  var G = voiceGroups();
  var pY = state.prefs.voiceYue || "auto";
  var pC = state.prefs.voiceCmn || "auto";
  var out = "";

  out += '<div class="vgroup"><h4>粵語（講解：粵、粵語例句）</h4>';
  out += voiceRow("yue","auto","自動（推薦）","",pY==="auto");
  G.yue.forEach(function(v){
    out += voiceRow("yue", v.name, v.name, v.lang, pY===v.name);
  });
  if(!G.yue.length){
    out += '<div class="vwarn">這個瀏覽器沒有粵語音色。Edge 內建「Microsoft HiuGaai／HiuMaan（粵語）」效果最好；'
         + 'Chrome 通常沒有，只能退回中文音色，發音會偏普通話。</div>';
  } else if(pY!=="auto" && !G.yue.some(function(v){return v.name===pY;})){
    out += '<div class="vwarn">之前選的音色已不存在（換了瀏覽器或系統更新），已回到「自動」。</div>';
  }
  out += '</div>';

  out += '<div class="vgroup"><h4>普通話（講解：普、譯文）</h4>';
  out += voiceRow("cmn","auto","自動（推薦）","",pC==="auto");
  G.cmn.forEach(function(v){
    out += voiceRow("cmn", v.name, v.name, v.lang, pC===v.name);
  });
  if(!G.cmn.length){
    out += '<div class="vwarn">沒有找到中文音色，語音朗讀可能沒有聲音。</div>';
  }
  out += '</div>';

  var total = (tts.voices||[]).length;
  out += '<p class="vsub" style="margin:14px 0 0">偵測到 '+total+' 個語音（粵語 '+G.yue.length
       + ' 個、普通話 '+G.cmn.length+' 個）。點一下即選用並試聽。</p>';
  box.innerHTML = out;
}

function openVoicePanel(){
  try{
    var ov = $("#vovl"), pn = $("#vpanel");
    if(!ov || !pn) return;
    renderVoicePanel();
    ov.classList.add("on"); pn.classList.add("on");
    if(!(tts.voices||[]).length){ tts.ready(function(){ renderVoicePanel(); }); }
  }catch(err){
    if(window.console) console.error("[voice panel]", err);
    toast("語音面板載入失敗");
  }
}
function closeVoicePanel(){
  var ov = $("#vovl"), pn = $("#vpanel");
  if(ov) ov.classList.remove("on");

function previewVoice(kind, name){
  var G = voiceGroups();
  var list = kind==="cmn" ? G.cmn : G.yue;
  var v = (name && name!=="auto") ? list.filter(function(x){return x.name===name;})[0] : null;
  if(name!=="auto" && !v){ toast("這個音色已不可用"); return; }
  var text = kind==="cmn"
    ? "这是用来试音的一句话，听到就说明设置成功。"
    : "呢句係用嚟試音嘅，你聽到就代表設定成功。";
  try{ window.speechSynthesis.cancel(); }catch(e){}
  setTimeout(function(){
    var u = new SpeechSynthesisUtterance(text);
    var use = v || tts.pick(kind==="cmn" ? "cmn" : "yue");
    if(use){ u.voice = use; u.lang = use.lang; }
    u.rate = 0.95;
    tts._lastU = u;
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

/* 板塊標題：課程可用 L.secTitles[k] = "自訂標題" 覆蓋教材通用名 */
function secTitleOf(L, k){
  var o = (L && L.secTitles) || {};
  if(o[k]) return o[k];
  return (SEC[k] && SEC[k].title) || k;
}
function secSubOf(L, k){
  var o = (L && L.secTitles) || {};
  if(o[k]) return "";          /* 覆蓋標題時不再顯示原板塊的說明，避免名不對題 */
  return (SEC[k] && SEC[k].sub) || "";
}

function buildSideToc(L){
  var secs = L.sections || [];
  var items = [{id:"s0", label:"導讀"}];
  secs.forEach(function(k,i){
    items.push({id:"s"+(i+1), label:CN(i+1)+" "+secTitleOf(L,k)});
  });
  items.push({id:"notes", label:"筆記"});
  /* 影片卡在課文區塊內，目錄裡就排在「課文」之後，與頁面順序一致 */
  if(L.video){
    var at = 1;
    for(var vi=0; vi<items.length; vi++){ if(items[vi].id === "s1") at = vi + 1; }
    items.splice(at, 0, {id:"video", label:"影片"});
  }
  return '<aside class="toc-side" id="toc-side" aria-label="本課目錄">'
    + '<div class="ts-h">本課目錄</div>'
    + items.map(function(it){
        return '<a class="ts-item" href="#'+it.id+'" data-toc="'+it.id+'">'+esc(it.label)+'</a>';
      }).join("")
    + '</aside>';
}

var spyTick = false;
function updateSpy(){
  spyTick = false;
  var links = $$(".toc-side .ts-item");
  if(!links.length) return;
  /* 以目錄條目為準收集節點：影片卡不是 .sec，必須一併納入高亮判定 */
  var nodes = [];
  links.forEach(function(a){
    var id = a.getAttribute("data-toc");
    var el = document.getElementById(id);
    if(el) nodes.push({id:id, el:el});
  });
  if(!nodes.length) return;
  nodes.sort(function(p,q){
    var r = p.el.compareDocumentPosition(q.el);
    return (r & 4) ? -1 : ((r & 2) ? 1 : 0);
  });
  var line = 132, cur = nodes[0].id;
  for(var i=0;i<nodes.length;i++){
    if(nodes[i].el.getBoundingClientRect().top - line <= 0) cur = nodes[i].id;
  }
  if(window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 60){
    cur = nodes[nodes.length-1].id;
  }
  links.forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-toc")===cur); });
}
function initScrollSpy(){ updateSpy(); }

    /* 編號區塊 */
    secs.forEach(function(k,i){

      + '<div class="notebar"><span id="savetip">'+(STORE_OK?"已同步至本機":"以檔案方式開啟，筆記僅存於本次瀏覽")+'</span>'

function scrollToHash(){
  var h = (location.hash||"").replace(/^#/,"");
  if(!h || h.indexOf("/")===0) { window.scrollTo(0,0); return; }
  var el = document.getElementById(h);
  if(el) setTimeout(function(){ el.scrollIntoView(); }, 60);
  else window.scrollTo(0,0);
}

/* ============ 課文區交互 ============ */
var ioWatcher = null;

function attachVideo(vid){
  vid.addEventListener("play", function(){ tts.stop(); });
  vid.addEventListener("ended", watchDone);
  vid.addEventListener("timeupdate", function(){
    if(vid.duration && vid.currentTime/vid.duration > 0.8) watchDone();
  });
  vid.addEventListener("error", function(){
    var stage = vid.parentNode;
    stage.innerHTML = '<div class="vid-err">影片載入失敗。請確認檔案存在且可讀：<br><code>'+esc(CUR.video)+'</code><br>'
      + '若以 <code>file://</code> 直接開啟，請改用 <code>start-server.bat</code> 啟動本地伺服器。</div>';
  });
}

function bindLesson(){
  var list = $("#sentlist");
  if(ioWatcher){ try{ ioWatcher.disconnect(); }catch(e){} ioWatcher=null; }

  if(list && !progOf(LID).read){
    var last = list.lastElementChild;
    if(last && "IntersectionObserver" in window){
      ioWatcher = new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting) unlock(true); });
      }, {rootMargin:"0px 0px -25% 0px", threshold:0});
      ioWatcher.observe(last);
    }
  }

  $$(".sent-note textarea").forEach(function(ta){
    var t;
    ta.addEventListener("input", function(){
      clearTimeout(t);
      t = setTimeout(function(){
        state.notes.sent[ta.getAttribute("data-note")] = ta.value;
        DB.set("notes", state.notes);
        setTip("已保存"); refreshRing();
      },600);
    });
  });

  var ln = $("#lessonnote");
  if(ln){
    var t2;
    ln.addEventListener("input", function(){
      clearTimeout(t2);
      t2 = setTimeout(function(){
        state.notes.lesson[LID] = ln.value;
        DB.set("notes", state.notes);
        setTip("已保存"); refreshRing();
      },600);
    });
  }

  var vid = $("#vid");
  if(vid) attachVideo(vid);
  onScroll();
}

function setTip(txt){
  var s = $("#savetip");
  if(!s) return;
  s.textContent = txt;
  clearTimeout(setTip._t);
  setTip._t = setTimeout(function(){ s.textContent = STORE_OK?"已同步至本機":"僅存於本次瀏覽"; }, 1600);
}

/* ============ 影片 ============ */
function watchDone(){
  if(progOf(LID).watched) return;
  state.prog[LID] = Object.assign({}, state.prog[LID], {watched:true});
  DB.set("prog", state.prog);
  refreshRing();
  toast("已記錄看片進度");
}
function renderMarks(){
  var box = $("#marklist");
  if(!box) return;

function download(name, text, type){

  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();

  var md = "# 粵語自習筆記\n\n> 教材：《粵語（香港話）教程（修訂版）》\n\n";
  Object.keys(state.notes.lesson).forEach(function(k){
    if(!state.notes.lesson[k]) return;

    md += "## "+(L2?("第 "+L2.no+" 課 "+L2.title):k)+"　課級筆記\n\n"+state.notes.lesson[k]+"\n\n";
    Object.keys(state.notes.sent).forEach(function(s){

      md += "### "+(sent?("第 "+pad2(sent.no)+" 句　"+sent.yue):s)+"\n\n";

/* ============ 全站搜索 ============ */
var IDX = null;
var pendingJump = null;

function buildIndex(){
  if(IDX) return IDX;
  var idx = {vocab:[], sent:[], lesson:[]};
  Object.keys(DATA).sort().forEach(function(k){
    var L = DATA[k];
    idx.lesson.push({lid:k, no:L.no, title:L.title, volume:L.volume});
    (L.vocab||[]).forEach(function(v){
      idx.vocab.push({lid:k, no:L.no, w:v.w, jp:v.jp||"", cmn:v.cmn||"", ex:v.ex||""});
    });
    (L.sentences||[]).forEach(function(s){
      idx.sent.push({lid:k, no:L.no, sid:s.id, yue:s.yue, jp:s.jp||"", cmn:s.cmn||""});
    });
  });
  IDX = idx;
  return idx;
}

function qnorm(s){ return String(s||"").toLowerCase().trim(); }

function searchAll(q){
  var n = qnorm(q);
  if(!n) return {lesson:[], vocab:[], sent:[]};
  var idx = buildIndex();
  var out = {lesson:[], vocab:[], sent:[]};
  idx.lesson.forEach(function(x){
    if(qnorm(x.title).indexOf(n) >= 0 || qnorm(x.volume).indexOf(n) >= 0) out.lesson.push(x);
  });
  idx.vocab.forEach(function(x){
    if(qnorm(x.w).indexOf(n) >= 0 || qnorm(x.jp).indexOf(n) >= 0 ||
       qnorm(x.cmn).indexOf(n) >= 0 || qnorm(x.ex).indexOf(n) >= 0) out.vocab.push(x);
  });
  idx.sent.forEach(function(x){
    if(qnorm(x.yue).indexOf(n) >= 0 || qnorm(x.jp).indexOf(n) >= 0 ||
       qnorm(x.cmn).indexOf(n) >= 0) out.sent.push(x);
  });
  return out;
}

/* ============ 聽力練習 ============ */
var LQ = null;
var LQ_N = 10;

function listenPool(){
  var pool = [];
  Object.keys(DATA).sort().forEach(function(k){
    var L = DATA[k];
    (L.sentences || []).forEach(function(s){
      if(!s.audio) return;
      pool.push({lid:k, no:L.no, sid:s.id, yue:s.yue, jp:s.jp || "",
                 cmn:s.cmn || "", audio:s.audio, slow:s.audioSlow});
    });
  });
  return pool;
}

function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function normText(s){
  return String(s || "").replace(/[\s，。！？；：、,.!?;:"'「」『』（）()]/g, "").toLowerCase();
}

function newListenSession(mode){
  var pool = listenPool();
  LQ = {
    pool: pool,
    list: shuffle(pool).slice(0, LQ_N),
    i: 0, right: 0, wrong: 0, answered: false,
    mode: mode || (LQ && LQ.mode) || "meaning",
    q: null
  };
  buildListenQuestion();
}

function buildListenQuestion(){
  var it = LQ.list[LQ.i];
  LQ.answered = false;
  if(LQ.mode === "meaning"){
    var opts = [{t: it.cmn, ok: true}];
    var used = {};
    used[it.cmn] = true;
    shuffle(LQ.pool).forEach(function(x){
      if(opts.length >= 4 || !x.cmn || used[x.cmn]) return;
      used[x.cmn] = true;
      opts.push({t: x.cmn, ok: false});
    });
    LQ.q = {opts: shuffle(opts), answer: -1};
    LQ.q.opts.forEach(function(o, i){ if(o.ok) LQ.q.answer = i; });
  } else {
    LQ.q = {opts: null, answer: -1};
  }
  renderListen();
}

function renderListen(){
  if(!LQ || !LQ.list.length){ newListenSession("meaning"); return; }
  var it = LQ.list[LQ.i];
  state.view = "listen";
  document.title = "粵語自習室 · 聽力練習";
  $("#crumb").innerHTML = "<b>聽力練習</b>";

  $("#view").innerHTML = ''
  + '<section class="hero"><div class="hero-main"><div class="kicker">YUE · LISTENING</div>'

  + '</div></section>'
  + '<section class="sec"><div class="sec-h"><span class="sec-num">聽</span><h2>'
  + (LQ.mode === "meaning" ? "先聽，再選意思" : "先聽，再把整句寫出來") + '</h2></div>'
  + '<div class="lq-bar"><span id="lq-prog">第 ' + (LQ.i + 1) + ' / ' + LQ.list.length + ' 題</span>'
  + '<span class="spacer"></span>'
  + '<span id="lq-score">正確 <b>' + LQ.right + '</b> · 錯誤 <b>' + LQ.wrong + '</b></span></div>'
  + '<div class="lq-card">'
  +   '<div class="lq-play">'
  +     '<button class="lq-big" data-act="lq-play" aria-label="播放">▶</button>'
  +     '<button class="tool" data-act="lq-slow">慢速再聽</button>'
  +   '</div>'
  +   body
  +   '<div class="lq-fb" id="lq-fb"></div>'
  + '</div>'
  + '<div class="lq-modes"><span class="sec-sub">模式：</span>'
  +   '<button class="tool' + (LQ.mode === "meaning" ? " active" : "") + '" data-act="lq-mode" data-mode="meaning">聽音選義</button>'
  +   '<button class="tool' + (LQ.mode === "dict" ? " active" : "") + '" data-act="lq-mode" data-mode="dict">聽寫</button>'

function updateListenStats(){
  var p = $("#lq-prog");
  if(p) p.textContent = "第 " + (LQ.i + 1) + " / " + LQ.list.length + " 題";
  var s = $("#lq-score");
  if(s) s.innerHTML = "正確 <b>" + LQ.right + "</b> · 錯誤 <b>" + LQ.wrong + "</b>";
}

function showListenFeedback(ok, it, counted){
  var fb = $("#lq-fb"); if(!fb) return;
  fb.className = "lq-fb on " + (ok ? "ok" : "bad");
  fb.innerHTML = '<div class="lq-res">' + (ok ? "✓ 答對" : (counted === false ? "已顯示答案" : "✗ 答錯")) + '</div>'
    + '<div class="lq-ans">' + esc(it.yue) + '</div>'
    + '<div class="lq-jp">' + esc(it.jp) + '</div>'
    + '<div class="lq-cmn">' + esc(it.cmn) + '　·　第 ' + pad2(it.no) + ' 課</div>'
    + '<button class="tool" data-act="lq-next">'
    + (LQ.i + 1 >= LQ.list.length ? "看本輪成績" : "下一題") + '</button>';
}

function lqPick(t){
  if(!LQ || LQ.answered) return;
  var i = +t.getAttribute("data-i");
  var ok = !!(LQ.q.opts[i] && LQ.q.opts[i].ok);
  LQ.answered = true;
  if(ok) LQ.right++; else LQ.wrong++;
  $$(".lq-opt").forEach(function(b, k){
    b.disabled = true;
    if(LQ.q.opts[k].ok) b.classList.add("right");
    else if(k === i) b.classList.add("wrong");
  });
  updateListenStats();
  showListenFeedback(ok, LQ.list[LQ.i]);
}

function lqSubmit(){
  if(!LQ || LQ.answered) return;
  var inp = $("#lq-in"); if(!inp) return;
  var it = LQ.list[LQ.i];
  var ok = normText(inp.value) === normText(it.yue);
  LQ.answered = true;
  if(ok) LQ.right++; else LQ.wrong++;
  inp.disabled = true;
  updateListenStats();
  showListenFeedback(ok, it);
}

function lqReveal(){
  if(!LQ || LQ.answered) return;
  LQ.answered = true;
  var inp = $("#lq-in"); if(inp) inp.disabled = true;
  showListenFeedback(false, LQ.list[LQ.i], false);
}

function lqNext(){
  if(!LQ) return;
  if(LQ.i + 1 >= LQ.list.length){ renderListenSummary(); return; }
  LQ.i++;
  buildListenQuestion();
}

function renderListenSummary(){
  state.view = "listen";
  var total = LQ.list.length;
  var rate = total ? Math.round(LQ.right / total * 100) : 0;
  $("#view").innerHTML = ''
  + '<section class="hero"><div class="hero-main"><div class="kicker">YUE · LISTENING</div>'

  + '<section class="sec"><div class="sec-h"><span class="sec-num">績</span><h2>'

      : rate >= 50 ? "再練一輪，注意連讀同語氣詞。"

function lqPlay(slow){
  if(!LQ || !LQ.list.length) return;

/* ============ 複習（間隔重複 · Leitner） ============ */
var RV = null;
var BOX_DAYS = [null, 1, 2, 4, 8, 16];      /* box 1..5 對應的間隔天數 */
var AGAIN_MS = 10 * 60 * 1000;              /* 「唔記得」→ 10 分鐘後再來 */
var WAUDIO = null;

function wordDue(w){ return (w.due || 0) <= Date.now(); }
function dueWords(){ return state.words.filter(wordDue); }
function reviewDueCount(){ return dueWords().length; }

function wordAudio(w){
  if(!WAUDIO){
    WAUDIO = {};
    Object.keys(DATA).forEach(function(k){
      (DATA[k].vocab || []).forEach(function(v){
        if(v.audio && !WAUDIO[v.w]) WAUDIO[v.w] = v.audio;
      });
    });
  }
  return WAUDIO[w] || "";
}

function scheduleWord(w, grade){
  var now = Date.now();
  if(grade === 0){
    w.box = 1;
    w.bad = (w.bad || 0) + 1;
    w.due = now + AGAIN_MS;
  } else if(grade === 1){
    w.box = Math.max(1, w.box || 1);
    w.ok = (w.ok || 0) + 1;
    w.due = now + BOX_DAYS[w.box] * 86400000;
  } else {
    w.box = Math.min(5, (w.box || 1) + 1);
    w.ok = (w.ok || 0) + 1;
    w.due = now + BOX_DAYS[w.box] * 86400000;
  }
  DB.set("words", state.words);
}

function startReview(){
  var list = dueWords();
  RV = {list: shuffle(list), i: 0, ok: 0, bad: 0, revealed: false};
  renderReview();
}

function renderReview(){
  if(!RV){ startReview(); return; }
  state.view = "review";
  document.title = "粵語自習室 · 複習";
  $("#crumb").innerHTML = "<b>複習</b>";
  $("#view").className = "wrap";

  if(!state.words.length){
    $("#view").innerHTML = '<section class="hero"><div class="hero-main">'
      + '<div class="kicker">YUE · REVIEW</div><h1>複習</h1></div></section>'
      + '<section class="sec"><p class="sec-sub">生詞本還是空的。去課文頁的詞彙卡上按 ☆，'
      + '加入之後這裡會按記憶曲線安排複習。</p>'
      + '<div class="lq-sum-btns"><button class="tool" data-act="home">去看課文</button></div></section>';
    renderNav(); window.scrollTo(0, 0); return;
  }

  if(RV.i >= RV.list.length){
    var nxt = state.words.filter(function(w){ return !wordDue(w); })
      .sort(function(a, b){ return (a.due || 0) - (b.due || 0); })[0];
    var when = "";
    if(nxt){
      var ms = (nxt.due || 0) - Date.now();
      var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000),
          m = Math.floor(ms % 3600000 / 60000);
      when = d > 0 ? (d + " 天後") : (h > 0 ? (h + " 小時後") : (m + " 分鐘後"));
    }
    $("#view").innerHTML = '<section class="hero"><div class="hero-main">'
      + '<div class="kicker">YUE · REVIEW</div><h1>本輪完成</h1>'
      + '<div class="meta"><span>複習 ' + RV.list.length + ' 個</span>'
      + '<span>記得 ' + RV.ok + '</span><span>唔記得 ' + RV.bad + '</span></div></div></section>'
      + '<section class="sec rv-sum"><p class="sec-sub">'
      + (when ? ("下次複習最快在 <b>" + when + "</b>。") : "所有生詞都排好下次複習時間了。")
      + '</p><div class="lq-sum-btns">'
      + '<button class="tool main" data-act="rv-again">再檢查一次</button>'
      + '<button class="tool" data-act="home">回課程</button></div></section>';
    renderNav(); window.scrollTo(0, 0); return;
  }

  var w = RV.list[RV.i];
  var card = '<div class="rv-card">'
    + '<div class="rv-word">' + esc(w.w) + '</div>'
    + '<button class="eb rv-play" data-act="rv-play" aria-label="朗讀">▶</button>'
    + (RV.revealed
        ? '<div class="rv-ans"><div class="rv-jp">' + esc(w.jp || "（無粵拼）") + '</div>'
          + '<div class="rv-cmn">' + esc(w.cmn || "") + '</div>'
          + (w.ex ? '<div class="rv-ex">' + esc(w.ex) + '</div>' : "") + '</div>'
          + '<div class="rv-grades">'
          + '<button class="rv-g bad" data-act="rv-grade" data-g="0">唔記得</button>'
          + '<button class="rv-g mid" data-act="rv-grade" data-g="1">有啲印象</button>'
          + '<button class="rv-g ok" data-act="rv-grade" data-g="2">記得</button></div>'
        : '<button class="tool main rv-show" data-act="rv-reveal">顯示答案</button>')
    + '</div>';

  $("#view").innerHTML = ''
  + '<section class="hero"><div class="hero-main"><div class="kicker">YUE · REVIEW</div>'
  + '<h1>複習</h1>'
  + '<div class="meta"><span>今日待複習 ' + dueWords().length + ' 個</span>'
  + '<span>生詞本共 ' + state.words.length + ' 個</span>'
  + '<span>第 ' + (RV.i + 1) + ' / ' + RV.list.length + '</span></div>'
  + '</div></section>'
  + '<section class="sec"><div class="sec-h"><span class="sec-num">記</span><h2>先自己想，再對答案</h2></div>'
  + '<p class="sec-sub">記得就往下一個盒子排更久；唔記得就回到第一個盒子，10 分鐘後再見。</p>'
  + card
  + '<p class="sec-sub rv-foot">本輪：記得 <b>' + RV.ok + '</b> · 唔記得 <b>' + RV.bad + '</b></p>'
  + '</section>';

  renderNav();
  applyPrefs();
  window.scrollTo(0, 0);
}

function rvReveal(){
  if(!RV || RV.i >= RV.list.length) return;
  RV.revealed = true;
  renderReview();
}

function rvGrade(g){
  if(!RV || RV.i >= RV.list.length) return;
  var w = RV.list[RV.i];
  scheduleWord(w, g);
  if(g === 0) RV.bad++; else RV.ok++;
  RV.i++;
  RV.revealed = false;
  renderReview();
}

function rvPlay(){
  if(!RV || RV.i >= RV.list.length) return;
  var w = RV.list[RV.i];
  tts.start([{audio: wordAudio(w.w), text: w.w}], {name: "生詞朗讀"});
}

/* ============ 語音總覽 ============ */
function phonicsItems(){
  var items = [];
  Object.keys(DATA).sort().forEach(function(k){
    var L = DATA[k];
    if(!L.phonetics) return;
    items.push({lid:k, no:L.no, title:L.title, ph:L.phonetics});
  });
  return items;
}

function phCard(x){
  var P = x.ph;
  var tbl = "";
  if((P.table || []).length){
    var cls = P.cols || [];
    tbl = '<table class="tone ph-table">'
      + ((P.headers || []).length
          ? '<thead><tr>' + P.headers.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join("") + '</tr></thead>'
          : "")
      + '<tbody>' + P.table.map(function(r){
          return '<tr>' + r.map(function(c, i){
            return '<td' + (cls[i] ? ' class="' + cls[i] + '"' : "") + '>' + esc(c) + '</td>';
          }).join("") + '</tr>';
        }).join("") + '</tbody></table>';
  }
  var cmp = (P.compare || []).length
    ? '<div class="ph-cmp">' + P.compare.map(function(c){
        return '<span class="ph-pair"><i>' + esc(c[0]) + '</i><b>' + esc(c[1]) + '</b></span>';
      }).join("") + '</div>'
    : "";
  var notes = (P.notes || []).length
    ? '<ul class="ph-notes">' + P.notes.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join("") + '</ul>'
    : "";
  return '<div class="ph-card" data-text="' + esc(x.title + " " + P.title + " " + (P.intro || "") + " "
      + (P.notes || []).join(" ")) + '">'
    + '<div class="ph-h"><span class="ph-no">L' + pad2(x.no) + '</span>'
    + '<h3>' + esc(P.title) + '</h3>'
    + '<button class="tool" data-act="go" data-no="' + x.no + '">第 ' + x.no + ' 課 →</button></div>'
    + (P.intro ? '<p class="ph-intro">' + esc(P.intro) + '</p>' : "")
    + tbl + cmp + notes
    + '</div>';
}

function renderPhonics(){
  state.view = "phonics";
  document.title = "粵語自習室 · 語音總覽";
  $("#crumb").innerHTML = "<b>語音總覽</b>";
  $("#view").className = "wrap";
  var items = phonicsItems();
  var nRow = 0;
  items.forEach(function(x){ nRow += (x.ph.table || []).length; });

  $("#view").innerHTML = ''
  + '<section class="hero"><div class="hero-main"><div class="kicker">YUE · PHONOLOGY</div>'
  + '<h1>語音總覽</h1>'
  + '<div class="meta"><span>' + items.length + ' 課語音點</span>'
  + '<span>' + nRow + ' 條例字</span><span>聲母 / 韻母 / 聲調</span></div>'
  + '</div></section>'
  + '<section class="sec"><div class="sec-h"><span class="sec-num">音</span><h2>二十課的語音重點，一頁查完</h2></div>'
  + '<p class="sec-sub">原本每個語音點只出現在所屬那一課。這裡按課號排開，'
  + '可以搜「聲調」「入聲」「ng」直接跳到相關課。</p>'
  + '<div class="srchbar"><input id="ph-q" class="srchin" placeholder="搜語音點，例如：入聲 / ng / 韻母" '
  + 'autocomplete="off" spellcheck="false" aria-label="篩選語音點">'
  + '<span class="sec-sub" id="ph-n">' + items.length + ' 課</span></div>'
  + '<div id="ph-list">' + items.map(phCard).join("") + '</div></section>';

  renderNav();
  applyPrefs();
  window.scrollTo(0, 0);
  var q = $("#ph-q");
  if(q){
    q.addEventListener("input", function(){
      var n = qnorm(q.value);
      var shown = 0;
      $$(".ph-card").forEach(function(c){
        var hit = !n || qnorm(c.getAttribute("data-text") || "").indexOf(n) >= 0 ||
                  qnorm(c.textContent).indexOf(n) >= 0;
        c.style.display = hit ? "" : "none";

      });

      if(box) box.textContent = shown + " / " + items.length + " 課";
    });
