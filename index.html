}

/* ============ 路由 ============ */
function parseRoute(){
  var h = (location.hash||"").replace(/^#\/?/,"");
  var m = h.match(/^lesson\/(\d+)/);
  if(m) return {view:"lesson", no:+m[1]};
  if(h==="home") return {view:"home"};
  if(h==="search") return {view:"search"};
  if(h==="listen") return {view:"listen"};
  if(h==="review") return {view:"review"};
  if(h==="phonics") return {view:"phonics"};
  return null;
}
function goLesson(no){
  location.hash = "#/lesson/"+no;
  if(parseRoute()===null) renderLesson(no);
}
function onRoute(){
  var r = parseRoute();
  if(!r) return;
  if(r.view==="home"){ renderHome(); }
  else if(r.view==="search"){ renderSearch(); }
  else if(r.view==="listen"){ if(!LQ || !LQ.list.length) newListenSession("meaning"); else renderListen(); }
  else if(r.view==="review"){ if(!RV) startReview(); else renderReview(); }
  else if(r.view==="phonics"){ renderPhonics(); }
  else if(!CUR || CUR.no!==r.no){ renderLesson(r.no); }
  else { window.scrollTo(0,0); }
}

/* ============ 事件 ============ */
document.addEventListener("click", function(e){
  var a = e.target.closest('a[href^="#"]');
  if(a && !a.hasAttribute("data-act")){
    e.preventDefault();
    var id = a.getAttribute("href").slice(1);
    var el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");

  if(act==="home"){ closeDrawer(); location.hash = "#/home"; renderHome(); }
  else if(act==="search"){ closeDrawer(); location.hash = "#/search"; renderSearch(); }
  else if(act==="search-clear"){
    var qi = $("#q");
    if(qi){ qi.value = ""; paintSearch(""); qi.focus(); }
  }
  else if(act==="open-result"){ closeDrawer(); openSearchResult(t); }
  else if(act==="listen"){
    closeDrawer();
    location.hash = "#/listen";
    if(!LQ || !LQ.list.length) newListenSession("meaning"); else renderListen();
  }
  else if(act==="lq-pick"){ lqPick(t); }
  else if(act==="lq-submit"){ lqSubmit(); }
  else if(act==="lq-reveal"){ lqReveal(); }
  else if(act==="lq-next"){ lqNext(); }
  else if(act==="lq-play"){ lqPlay(false); }
  else if(act==="lq-slow"){ lqPlay(true); }
  else if(act==="lq-mode"){ newListenSession(t.getAttribute("data-mode")); }
  else if(act==="lq-restart" || act==="lq-again"){ newListenSession(); }
  else if(act==="review"){
    closeDrawer();
    location.hash = "#/review";
    if(!RV) startReview(); else renderReview();
  }
  else if(act==="rv-reveal"){ rvReveal(); }
  else if(act==="rv-grade"){ rvGrade(+t.getAttribute("data-g")); }
  else if(act==="rv-again"){ RV = {list: shuffle(RV.list), i: 0, ok: 0, bad: 0, revealed: false}; renderReview(); }
  else if(act==="rv-play"){ rvPlay(); }
  else if(act==="phonics"){ closeDrawer(); location.hash = "#/phonics"; renderPhonics(); }
  else if(act==="go"){
    var no = +t.getAttribute("data-no");
    var L2 = lessonById(no);
    if(!L2){ toast("該課尚未整理"); return; }
    closeDrawer();
    var same = CUR && CUR.no===no;
    location.hash = "#/lesson/"+no;
    if(same) renderLesson(no);
  }
  else if(act==="menu"){
    var sb = $("#sidebar");
    sb.classList.toggle("open");
    $("#scrim").classList.toggle("on", sb.classList.contains("open"));
  }
  else if(act==="theme"){
    var d = document.documentElement.getAttribute("data-theme")==="dark";
    state.prefs.theme = d?"light":"dark"; DB.set("prefs", state.prefs); applyPrefs();
  }
  else if(act==="t-jp"){ state.prefs.jp = !state.prefs.jp; DB.set("prefs", state.prefs); applyPrefs(); }
  else if(act==="t-cmn"){ state.prefs.cmn = !state.prefs.cmn; DB.set("prefs", state.prefs); applyPrefs(); }
  else if(act==="rate"){
    state.prefs.rate = t.getAttribute("data-rate"); DB.set("prefs", state.prefs);
    $$("[data-act='rate']").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-rate")===state.prefs.rate); });
    toast(state.prefs.rate==="slow" ? "慢速：跟讀用" : "常速");
  }
  else if(act==="shadow"){
    state.prefs.shadow = !state.prefs.shadow; DB.set("prefs", state.prefs);
    t.classList.toggle("on", state.prefs.shadow);
    var pm = $(".pb-main");
    if(pm){ pm.classList.toggle("shadow", state.prefs.shadow); pm.textContent = state.prefs.shadow?"▶ 跟讀模式":"▶ 全課朗讀"; }
    toast(state.prefs.shadow ? "跟讀：每句後留白 2 秒" : "已關閉跟讀");
  }
  else if(act==="mask"){
    var m = state.prefs.mask||"";
    state.prefs.mask = m==="" ? "hanzi" : (m==="hanzi" ? "jp" : "");
    DB.set("prefs", state.prefs); applyPrefs();
    t.textContent = state.prefs.mask===""?"遮字：無":state.prefs.mask==="hanzi"?"遮字：藏漢字":"遮字：藏粵拼";
    toast(state.prefs.mask===""?"已顯示全文":state.prefs.mask==="hanzi"?"只留粵拼，看拼讀字":"只留漢字，考粵拼");
  }
  else if(act==="play" || act==="slow"){
    var sid = t.getAttribute("data-sid");
    var s = (CUR.sentences||[]).filter(function(x){ return x.id===sid; })[0];
    if(!s) return;
    if(act==="slow"){
      state.prefs.rate="slow";
      $$("[data-act='rate']").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-rate")==="slow"); });
    }
    playSentence(s);
  }
  else if(act==="play-all"){
    tts.start((CUR.sentences||[]).map(function(s){
      return {key:s.id, audio:s.audio, slow:s.audioSlow, text:s.yue};
    }), {
      gap: state.prefs.shadow ? 2000 : 240,
      name: state.prefs.shadow ? "跟讀模式" : "全課朗讀"
    });
  }
  else if(act==="play-text"){
    var be = t.closest(".vcard") || t.closest(".ex") || t.closest(".numcell") || null;
    var auEl = t.closest("[data-audio]");
    var au = auEl ? auEl.getAttribute("data-audio") : "";
    playPlain(t.getAttribute("data-text"), be, "例句", au);
  }
  else if(act==="play-passage"){
    tts.start([{audio:CUR.passage.audio, text:CUR.passage.text}], {name:"整段朗讀"});
  }
  else if(act==="play-line"){
    var ln = CUR.passage.lines[+t.getAttribute("data-i")];
    if(ln) tts.start([{key:ln.id, audio:ln.audio, slow:ln.audioSlow, text:ln.yue}], {name:"短文"});
  }
  else if(act==="play-dline"){
    var dl = CUR.dialogue.lines[+t.getAttribute("data-i")];
    if(dl) tts.start([{key:dl.id, audio:dl.audio, slow:dl.audioSlow, text:dl.yue}], {name:"會話"});
  }
  else if(act==="stop"){
    tts.stop();
    $$(".sec-read.on, .k-read.on").forEach(function(b){ b.classList.remove("on"); });
  }
  else if(act==="read-sec"){
    var sec = t.closest(".sec");
    var blocks = collectBlocks(sec);
    if(!blocks.length){ toast("本節沒有可朗讀文字"); return; }
    $$(".sec-read.on, .k-read.on").forEach(function(b){ b.classList.remove("on"); });
    t.classList.add("on");
    toast("朗讀本節 · "+(state.prefs.explain==="yue"?"粵語":"普通話")+"講解");
    tts.start(blocks.map(function(b){ return {text:b.text, el:b.el, cls:"reading", lang:b.lang, audio:b.audio}; }),
              {gap:180, name:"朗讀本節", onEnd:function(){ t.classList.remove("on"); }});
  }
  else if(act==="read-card"){
    var card = t.closest(".kcard");
    var blocks2 = collectBlocks(card);
    if(!blocks2.length) return;
    $$(".sec-read.on, .k-read.on").forEach(function(b){ b.classList.remove("on"); });
    t.classList.add("on");
    tts.start(blocks2.map(function(b){ return {text:b.text, el:b.el, cls:"reading", lang:b.lang, audio:b.audio}; }),
              {gap:180, name:"朗讀這一則", onEnd:function(){ t.classList.remove("on"); }});
  }
  else if(act==="voice-panel"){
    openVoicePanel();
  }
  else if(act==="voice-close"){
    closeVoicePanel();
  }
  else if(act==="voice-pick"){
    var kind = t.getAttribute("data-kind") || "yue";
    var vname = t.getAttribute("data-name") || "auto";
    if(kind==="cmn") state.prefs.voiceCmn = vname;
    else state.prefs.voiceYue = vname;
    DB.set("prefs", state.prefs);
    renderVoicePanel();
    previewVoice(kind, vname);
    toast(vname==="auto" ? "已改用自動挑選" : "已選用：" + vname);
  }
  else if(act==="explain-lang"){
    state.prefs.explain = state.prefs.explain==="yue" ? "cmn" : "yue";
    DB.set("prefs", state.prefs); applyPrefs();
    toast(state.prefs.explain==="yue" ? "講解改用粵語朗讀（練聽力）" : "講解用普通話朗讀（聽得清）");
  }
  else if(act==="toggle-note"){
    var box = t.closest(".sent").querySelector(".sent-note");
    box.classList.toggle("show");
    t.classList.toggle("on", box.classList.contains("show"));
    if(box.classList.contains("show")) box.querySelector("textarea").focus();
  }
  else if(act==="fav"){
    var i = +t.getAttribute("data-i"), v = CUR.vocab[i];
    var idx = -1;
    state.words.forEach(function(w,k){ if(w.w===v.w) idx=k; });
    if(idx>=0){ state.words.splice(idx,1); t.classList.remove("on"); t.textContent="☆"; toast("已移出生詞本"); }
    else{ state.words.push({w:v.w, jp:v.jp, cmn:v.cmn, ex:v.ex, at:Date.now(),
                            box:1, due:Date.now(), ok:0, bad:0}); t.classList.add("on"); t.textContent="★"; toast("已加入生詞本"); }
    DB.set("words", state.words);
    $("#vw-count").textContent = state.words.length;
  }
  else if(act==="unlock"){ unlock(false); }
  else if(act==="opt"){
    var qi = +t.getAttribute("data-q"), j = +t.getAttribute("data-j"), q = CUR.exercises[qi];
    var box2 = t.closest(".q");
    state.quiz[LID] = state.quiz[LID] || {};
    state.quiz[LID][qi] = {pick:j, ok: j===q.answer};
    DB.set("quiz", state.quiz);
    $$(".opt", box2).forEach(function(o,k){
      o.classList.remove("right","wrong");
      if(k===q.answer) o.classList.add("right");
      if(k===j && j!==q.answer) o.classList.add("wrong");
    });
    $(".why", box2).classList.add("show");
    var qs = quizScore(LID, CUR);
    var qa = $("#q-answered"), qr = $("#q-right");
    if(qa) qa.textContent = qs.answered;
    if(qr) qr.textContent = qs.right;
    refreshRing();
  }
  else if(act==="quiz-reset"){
    state.quiz[LID] = {}; DB.set("quiz", state.quiz);
    renderLesson(CUR.no);
    var s9 = $("#s9"); if(s9) s9.scrollIntoView();
    toast("練習已清空");
  }
  else if(act==="open-vocab"){ openDrawer("vocab"); }
  else if(act==="open-notes"){ openDrawer("notes"); }
  else if(act==="close-drawer"){ closeDrawer(); }
  else if(act==="close-all"){ closeDrawer(); }
  else if(act==="del-word"){
    state.words.splice(+t.getAttribute("data-i"),1); DB.set("words", state.words);
    openDrawer("vocab"); $("#vw-count").textContent = state.words.length;
  }
  else if(act==="export"){ exportNotes(); }
  else if(act==="export-words"){
    download("yue-words-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(state.words,null,2), "application/json");
    toast("生詞已匯出");
  }
  else if(act==="export-anki"){
    if(!state.words.length){ toast("生詞本是空的"); return; }
    var tsv = state.words.map(function(w){ return [w.w, w.jp, w.cmn, w.ex||""].join("\t"); }).join("\n");
    download("yue-anki-"+new Date().toISOString().slice(0,10)+".txt", tsv, "text/tab-separated-values;charset=utf-8");
    toast("已匯出 "+state.words.length+" 張 Anki 卡片");
  }
  else if(act==="mark-done"){
    state.prog[LID] = Object.assign({}, state.prog[LID], {read:true, done:true});
    DB.set("prog", state.prog);
    t.textContent = "已完成 ✓";
    refreshRing(); renderNav(); toast("本課已完成");
  }
  else if(act==="vrate"){
    var r = parseFloat(t.getAttribute("data-r"));
    var vid2 = $("#vid");
    if(vid2) vid2.playbackRate = r;
    $$("#ratechips button").forEach(function(b){ b.classList.toggle("on", b===t); });
    toast("播放速度 "+r+"×");
  }
  else if(act==="mark-add"){ addMark(); }
  else if(act==="seek"){ seekTo(parseFloat(t.getAttribute("data-t"))); }
  else if(act==="del-mark"){
    state.marks.splice(+t.getAttribute("data-i"),1);
    DB.set("marks", state.marks); renderMarks();
  }
  else if(act==="pages"){ openPages(); }
  else if(act==="lb-close"){ closePages(); }
  else if(act==="lb-prev"){ lbGo(-1); }
  else if(act==="lb-next"){ lbGo(1); }
  else if(act==="jump"){
    var el = document.getElementById(t.getAttribute("data-to"));
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }
  else if(act==="fb-expand"){ $("#fball").classList.toggle("expanded"); }
  else if(act==="fb-play"){ tts.toggle(); }
  else if(act==="fb-prev"){ tts.prev(); }
  else if(act==="fb-next"){ tts.next(); }
  else if(act==="fb-stop"){ tts.stop(); }
  else if(act==="fb-locate"){
    var cel = tts.curEl;
    if(cel) cel.scrollIntoView({behavior:"smooth", block:"center"});
    else toast("目前沒有正在朗讀的段落");
  }
  else if(act==="keys"){ toast("空格 全課朗讀 · ← → 影片快退快進 · Esc 關閉"); }
});

document.addEventListener("input", function(e){
  var inp = e.target;
  if(inp && inp.hasAttribute("data-mark")){
    var idx = +inp.getAttribute("data-mark");
    if(state.marks[idx]){ state.marks[idx].text = inp.value; DB.set("marks", state.marks); }
  }
});

document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ closePages(); closeDrawer(); return; }
  if($("#lightbox").classList.contains("on")){
    if(e.key==="ArrowLeft"){ lbGo(-1); e.preventDefault(); return; }
    if(e.key==="ArrowRight"){ lbGo(1); e.preventDefault(); return; }
  }
  var tag = (e.target.tagName||"").toUpperCase();
  if(tag==="TEXTAREA" || tag==="INPUT" || tag==="SELECT") return;
  if(e.key===" " && tag!=="BUTTON" && tag!=="A" && state.view==="lesson"){
    e.preventDefault();
    var b = $("[data-act='play-all']");
    if(b) b.click();
  }
  if(tag==="BODY" || tag==="HTML"){
    var v = $("#vid");
    if(v && !v.paused){
      if(e.key==="ArrowLeft"){ v.currentTime = Math.max(0, v.currentTime-3); e.preventDefault(); }
      if(e.key==="ArrowRight"){ v.currentTime = Math.min(v.duration||0, v.currentTime+3); e.preventDefault(); }
    }
  }
});

function onScroll(){
  var h = document.documentElement;
  var max = h.scrollHeight - h.clientHeight;
  var p = max>0 ? (h.scrollTop||document.body.scrollTop)/max : 0;
  var bar = $("#pl"); if(bar) bar.style.width = (p*100).toFixed(1)+"%";
}
window.addEventListener("scroll", onScroll, {passive:true});
window.addEventListener("scroll", function(){
  if(!spyTick){ spyTick = true; requestAnimationFrame(updateSpy); }
}, {passive:true});
window.addEventListener("hashchange", onRoute);

/* ============ 啟動 ============ */
window.addEventListener("error", function(ev){
  try{ toast("腳本錯誤：" + (ev.message||"unknown")); }catch(e){}
});
applyPrefs();
tts.load();
var r0 = parseRoute();
if(r0 && r0.view==="home") renderHome();
else if(r0 && r0.view==="search") renderSearch();
else if(r0 && r0.view==="listen"){ newListenSession("meaning"); }
else if(r0 && r0.view==="review"){ startReview(); }
else if(r0 && r0.view==="phonics"){ renderPhonics(); }
else renderLesson(r0 && r0.no ? r0.no
                   : (state.last && lessonById(state.last) ? state.last
                     : (DATA.L03 ? 3 : firstReady())));
setTimeout(onScroll, 120);

})();
</script>
